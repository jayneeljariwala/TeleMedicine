services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: nhs111
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5431:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  seq:
    image: datalust/seq:latest
    ports:
      - "5341:80"
    environment:
      ACCEPT_EULA: "Y"

  api:
    build:
      context: ./NHS111.Integration
      dockerfile: src/NHS111.API/Dockerfile
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=nhs111;Username=postgres;Password=1234;
      - ConnectionStrings__Redis=redis:6379
      - RabbitMQ__Host=rabbitmq

  ummanu-consumer:
    build:
      context: ./NHS111.Integration
      dockerfile: consumers/NHS111.UmmanuConsumer/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - RabbitMQ__Host=rabbitmq
      - ExternalApis__UmmanuBaseUrl=http://ummanu-dummy-api:7001

  adastra-consumer:
    build:
      context: ./NHS111.Integration
      dockerfile: consumers/NHS111.AdastraConsumer/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - RabbitMQ__Host=rabbitmq
      - ExternalApis__AdastraBaseUrl=http://adastra-dummy-api:7002

networks:
  default:
    name: nhs111-network
    external: true

volumes:
  postgres_data:
